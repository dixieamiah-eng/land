<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تواصل معي | متجر علي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1020;--sf:#131c33;--ln:#26335a;--tx:#e8edff;--mu:#8e9bc4;--a:#28e0c4;--b:#ff5c8a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Tajawal',sans-serif;line-height:1.8;min-height:100svh;display:grid;place-items:center;padding:24px;overflow-x:hidden}
#cv{position:fixed;inset:0;z-index:0;pointer-events:none}
.box{position:relative;z-index:1;width:100%;max-width:520px;background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:32px 26px}
.bk{color:var(--mu);text-decoration:none;font-size:.9rem}
.bk:hover{color:var(--a)}
h1{font-family:'Cairo',sans-serif;font-weight:900;font-size:1.9rem;margin:10px 0 4px}
p.s{color:var(--mu);margin-bottom:22px}
label{display:block;font-weight:700;margin:16px 0 6px}
textarea,input{width:100%;background:var(--bg);border:1.5px solid var(--ln);border-radius:12px;color:var(--tx);font:inherit;padding:12px 14px;transition:border-color .2s,box-shadow .2s}
textarea{min-height:140px;resize:vertical}
input{direction:ltr;text-align:left}
textarea:focus,input:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 4px rgba(40,224,196,.15)}
.er{border-color:var(--b)!important;animation:sk .35s}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cn{text-align:left;color:var(--mu);font-size:.8rem}
.go{width:100%;margin-top:22px;padding:15px;border:0;border-radius:99px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:900;font-size:1.1rem;color:#06231e;background:linear-gradient(90deg,var(--a),#7af0dd);transition:transform .2s,opacity .2s}
.go:hover{transform:scale(1.02)}
.go:disabled{opacity:.6;cursor:wait;transform:none}
.ms{margin-top:14px;text-align:center;min-height:1.6em;font-weight:700}
.ok{color:var(--a)}.no{color:var(--b)}
.dn{display:none;text-align:center;padding:20px 0}
.dn svg{width:90px;height:90px}
.dn circle,.dn path{fill:none;stroke:var(--a);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:300;stroke-dashoffset:300;animation:dw .9s .1s forwards}
.dn path{animation-delay:.6s}
@keyframes dw{to{stroke-dashoffset:0}}
.dn h2{font-family:'Cairo',sans-serif;margin-top:10px}
a:focus-visible,button:focus-visible{outline:3px solid var(--b);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.dn circle,.dn path{stroke-dashoffset:0}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="box">
  <a class="bk" href="index.html">← رجوع للرئيسية</a>

  <form id="fm" novalidate>
    <h1>تواصل معي</h1>
    <p class="s">رسالتك توصلني مباشرة على تلكرام</p>

    <label for="tx">تفضل حبيبي اكتب رسالتك هنا :</label>
    <textarea id="tx" maxlength="1000" placeholder="شتحتاج؟ اكتب طلبك بالتفصيل..."></textarea>
    <div class="cn"><span id="ct">0</span>/1000</div>

    <label for="us">يوزرك على تلكرام للتواصل :</label>
    <input id="us" maxlength="33" placeholder="@username" autocomplete="off">

    <button class="go" id="bt" type="submit">إرسال الرسالة</button>
    <div class="ms" id="ms" role="status"></div>
  </form>

  <div class="dn" id="dn">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/><path d="M28 52l16 16 28-34"/></svg>
    <h2>وصلت رسالتك ✅</h2>
    <p class="s">راح أرد عليك على تلكرام بأقرب وقت</p>
  </div>
</div>

<script>
/* ===== الإعدادات: عدّل هذين السطرين فقط ===== */
const TOKEN='8683729849:AAHb_K28br4KdLaSke6VUVnjAG_NPwcXMTk';   // توكن البوت من @BotFather
const CHAT='8035808646';            // آيدي حسابك (الرسائل توصل لك)
/* ============================================= */

const $=s=>document.querySelector(s);
const fm=$('#fm'),tx=$('#tx'),us=$('#us'),bt=$('#bt'),ms=$('#ms');

tx.addEventListener('input',()=>$('#ct').textContent=tx.value.length);

const bad=(el)=>{el.classList.remove('er');void el.offsetWidth;el.classList.add('er');el.focus()};
const say=(t,c)=>{ms.textContent=t;ms.className='ms '+c};

fm.addEventListener('submit',async e=>{
  e.preventDefault();
  [tx,us].forEach(x=>x.classList.remove('er'));
  const m=tx.value.trim();
  const u=us.value.trim().replace(/^@/,'');

  if(m.length<3){bad(tx);return say('اكتب رسالتك أول','no')}
  if(!/^[A-Za-z0-9_]{5,32}$/.test(u)){bad(us);return say('اليوزر لازم يكون 5-32 حرف إنكليزي أو رقم أو _','no')}

  const last=+localStorage.getItem('last')||0;
  const w=30000-(Date.now()-last);
  if(w>0)return say(`انتظر ${Math.ceil(w/1000)} ثانية قبل ما ترسل مرة ثانية`,'no');

  bt.disabled=true;bt.textContent='جاري الإرسال...';say('','');
  const body=`📩 رسالة جديدة من الموقع\n\n👤 اليوزر: @${u}\n🔗 https://t.me/${u}\n\n💬 الرسالة:\n${m}`;

  try{
    const r=await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:CHAT,text:body,disable_web_page_preview:true})
    });
    const j=await r.json();
    if(!j.ok)throw new Error(j.description||'خطأ');
    localStorage.setItem('last',Date.now());
    fm.style.display='none';$('#dn').style.display='block';
  }catch(err){
    bt.disabled=false;bt.textContent='إرسال الرسالة';
    say('صار خطأ بالإرسال، جرب مرة ثانية','no');
    console.error(err);
  }
});

/* خلفية الجزيئات */
const cv=$('#cv'),g=cv.getContext('2d');let W,H,P=[],p0={x:-999,y:-999};
const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(70,W/14|0)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}))};
addEventListener('resize',rs);rs();
addEventListener('pointermove',e=>{p0.x=e.clientX;p0.y=e.clientY});
(function dr(){
  g.clearRect(0,0,W,H);
  P.forEach((p,k)=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    const dx=p.x-p0.x,dy=p.y-p0.y,ds=Math.hypot(dx,dy);
    if(ds<120){p.x+=dx/ds*1.5;p.y+=dy/ds*1.5}
    g.fillStyle='rgba(40,224,196,.7)';g.beginPath();g.arc(p.x,p.y,1.8,0,7);g.fill();
    for(let q=k+1;q<P.length;q++){
      const o=P[q],e=Math.hypot(p.x-o.x,p.y-o.y);
      if(e<110){g.strokeStyle=`rgba(255,92,138,${.25*(1-e/110)})`;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(o.x,o.y);g.stroke()}
    }
  });
  requestAnimationFrame(dr);
})();
</script>
</body>
</html>
